<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details - ZuStore Admin</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #1890FF;
            text-decoration: none;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        .user-header {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-size: 2rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }

        .user-email {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .badges {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .badge-admin { background: #e6f7ff; color: #1890ff; }
        .badge-seller { background: #fff7e6; color: #fa8c16; }
        .badge-buyer { background: #f6ffed; color: #52c41a; }
        .badge-courier { background: #f9f0ff; color: #722ed1; }
        .badge-active { background: #f6ffed; color: #52c41a; }
        .badge-suspended { background: #fff1f0; color: #ff4d4f; }
        .badge-superuser { background: #ff4d4f; color: white; }

        .user-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #1890FF;
            color: white;
        }

        .btn-primary:hover {
            background: #0070DD;
        }

        .btn-danger {
            background: #ff4d4f;
            color: white;
        }

        .btn-danger:hover {
            background: #d9363e;
        }

        .btn-success {
            background: #52c41a;
            color: white;
        }

        .btn-success:hover {
            background: #389e0d;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .detail-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 500;
            color: #666;
        }

        .detail-value {
            color: #1a1a1a;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-box {
            background: #f9f9f9;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: #1890FF;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        .error {
            background: #fff1f0;
            color: #ff4d4f;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="admin-users-v2.html" class="back-button">← Back to Users</a>

        <div id="loading" class="loading">Loading user details...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="user-content" style="display: none;">
            <!-- User header -->
            <div class="user-header">
                <div class="user-info">
                    <h1 class="user-name" id="user-name"></h1>
                    <div class="user-email" id="user-email"></div>
                    <div class="badges" id="user-badges"></div>
                </div>
                <div class="user-actions" id="user-actions"></div>
            </div>

            <!-- Detail grid -->
            <div class="detail-grid">
                <!-- Account Information -->
                <div class="detail-card">
                    <h2 class="card-title">Account Information</h2>
                    <div id="account-info"></div>
                </div>

                <!-- Role-specific information -->
                <div class="detail-card" id="role-card" style="display: none;">
                    <h2 class="card-title" id="role-card-title"></h2>
                    <div id="role-info"></div>
                </div>

                <!-- Activity Statistics -->
                <div class="detail-card" id="stats-card" style="display: none;">
                    <h2 class="card-title">Activity Statistics</h2>
                    <div id="stats-info"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js?v=20260129c"></script>
    <script src="/static/js/role-guard.js?v=20260129"></script>
    <script>
        let currentUser = null;

        async function init() {
            // Check admin access
            const hasAccess = await RoleGuard.requireAnyRole('ADMIN', 'SUPER_ADMIN');
            if (!hasAccess) return;

            // Get user ID from URL
            const params = new URLSearchParams(window.location.search);
            const userId = params.get('id');

            if (!userId) {
                showError('No user ID provided');
                return;
            }

            await loadUserDetail(userId);
        }

        async function loadUserDetail(userId) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('user-content');

            try {
                loading.style.display = 'block';
                error.style.display = 'none';
                content.style.display = 'none';

                const user = await api.getUserDetail(userId);
                currentUser = user;

                renderUserDetail(user);

                loading.style.display = 'none';
                content.style.display = 'block';

            } catch (err) {
                console.error('Failed to load user:', err);
                showError('Failed to load user details: ' + err.message);
                loading.style.display = 'none';
            }
        }

        function renderUserDetail(user) {
            // Header
            document.getElementById('user-name').textContent = 
                `${user.first_name} ${user.last_name}`.trim() || user.username;
            document.getElementById('user-email').textContent = user.email;

            // Badges
            const badges = [];
            badges.push(`<span class="badge badge-${user.role.toLowerCase()}">${user.role}</span>`);
            badges.push(`<span class="badge badge-${user.is_active ? 'active' : 'suspended'}">${user.is_active ? 'Active' : 'Suspended'}</span>`);
            if (user.is_superuser) {
                badges.push(`<span class="badge badge-superuser">Super Admin</span>`);
            }
            document.getElementById('user-badges').innerHTML = badges.join('');

            // Actions
            const actions = [];
            if (!user.is_superuser) {
                if (user.is_active) {
                    actions.push(`<button class="btn btn-danger" onclick="suspendUser(${user.id})">Suspend Account</button>`);
                } else {
                    actions.push(`<button class="btn btn-success" onclick="activateUser(${user.id})">Activate Account</button>`);
                }
            }
            document.getElementById('user-actions').innerHTML = actions.join('');

            // Account Information
            document.getElementById('account-info').innerHTML = `
                <div class="detail-row">
                    <span class="detail-label">Username</span>
                    <span class="detail-value">${user.username}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">User ID</span>
                    <span class="detail-value">#${user.id}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Status</span>
                    <span class="detail-value">${user.status}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Joined</span>
                    <span class="detail-value">${new Date(user.date_joined).toLocaleDateString()}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Last Login</span>
                    <span class="detail-value">${user.last_login ? new Date(user.last_login).toLocaleDateString() : 'Never'}</span>
                </div>
                ${user.suspended_at ? `
                <div class="detail-row">
                    <span class="detail-label">Suspended</span>
                    <span class="detail-value">${new Date(user.suspended_at).toLocaleDateString()}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Reason</span>
                    <span class="detail-value">${user.suspension_reason || 'N/A'}</span>
                </div>
                ` : ''}
            `;

            // Role-specific info
            renderRoleSpecificInfo(user);
        }

        function renderRoleSpecificInfo(user) {
            const roleCard = document.getElementById('role-card');
            const roleCardTitle = document.getElementById('role-card-title');
            const roleInfo = document.getElementById('role-info');
            const statsCard = document.getElementById('stats-card');
            const statsInfo = document.getElementById('stats-info');

            if (user.role === 'SELLER' && user.seller) {
                roleCard.style.display = 'block';
                roleCardTitle.textContent = 'Seller Information';
                roleInfo.innerHTML = `
                    <div class="detail-row">
                        <span class="detail-label">Store Name</span>
                        <span class="detail-value">${user.seller.store_name}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Business Reg</span>
                        <span class="detail-value">${user.seller.business_registration || 'N/A'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Verification</span>
                        <span class="detail-value">${user.seller.verification_status}</span>
                    </div>
                `;

                statsCard.style.display = 'block';
                statsInfo.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-value">${user.seller.total_products}</div>
                            <div class="stat-label">Products</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${user.seller.total_sales}</div>
                            <div class="stat-label">Sales</div>
                        </div>
                    </div>
                `;
            } else if (user.role === 'BUYER' && user.buyer) {
                statsCard.style.display = 'block';
                statsInfo.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-value">${user.buyer.total_orders}</div>
                            <div class="stat-label">Orders</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${user.buyer.completed_orders}</div>
                            <div class="stat-label">Completed</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">K${user.buyer.total_spent.toFixed(2)}</div>
                            <div class="stat-label">Total Spent</div>
                        </div>
                    </div>
                `;
            } else if (user.role === 'COURIER' && user.courier) {
                roleCard.style.display = 'block';
                roleCardTitle.textContent = 'Courier Information';
                roleInfo.innerHTML = `
                    <div class="detail-row">
                        <span class="detail-label">Vehicle Type</span>
                        <span class="detail-value">${user.courier.vehicle_type}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">License</span>
                        <span class="detail-value">${user.courier.license_number}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Verification</span>
                        <span class="detail-value">${user.courier.verification_status}</span>
                    </div>
                `;

                statsCard.style.display = 'block';
                statsInfo.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-value">${user.courier.total_deliveries}</div>
                            <div class="stat-label">Deliveries</div>
                        </div>
                    </div>
                `;
            }
        }

        async function suspendUser(userId) {
            if (!confirm('Are you sure you want to suspend this user?')) {
                return;
            }

            try {
                await api.request(`/admin/users/${userId}/suspend/`, {
                    method: 'POST'
                });
                alert('User suspended successfully');
                await loadUserDetail(userId);
            } catch (err) {
                alert('Failed to suspend user: ' + err.message);
            }
        }

        async function activateUser(userId) {
            if (!confirm('Are you sure you want to activate this user?')) {
                return;
            }

            try {
                await api.request(`/admin/users/${userId}/activate/`, {
                    method: 'POST'
                });
                alert('User activated successfully');
                await loadUserDetail(userId);
            } catch (err) {
                alert('Failed to activate user: ' + err.message);
            }
        }

        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = message;
            error.style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
