<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug User Info</title>
    <style>
        body { font-family: monospace; padding: 2rem; background: #f5f5f5; }
        .container { background: white; padding: 2rem; border-radius: 8px; max-width: 800px; margin: 0 auto; }
        h1 { margin: 0 0 1rem; }
        pre { background: #f5f5f5; padding: 1rem; border-radius: 4px; overflow-x: auto; }
        .error { color: #ff3b30; }
        .success { color: #34c759; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 User Debug Info</h1>
        <div id="output">Loading...</div>
    </div>

    <script src="/static/js/api.js?v=20260116"></script>
    <script>
        async function debugUser() {
            const output = document.getElementById('output');
            
            try {
                // Check if API loaded
                if (typeof ZuStoreAPI === 'undefined') {
                    output.innerHTML = '<p class="error">API script failed to load. Check console.</p>';
                    return;
                }
                
                const api = new ZuStoreAPI();
                
                if (!api.isAuthenticated()) {
                    output.innerHTML = '<p class="error">Not authenticated. <a href="login.html">Login</a></p>';
                    return;
                }

                // Get user profile
                output.innerHTML = '<p>Fetching profile...</p>';
                const profile = await api.getProfile();
                output.innerHTML = '<p>Profile loaded. Fetching analytics...</p>';
                
                // Try to get seller analytics
                let analytics = null;
                let analyticsError = null;
                try {
                    analytics = await api.getSellerAnalytics();
                } catch (err) {
                    analyticsError = err.message;
                }

                // Try to get products
                let products = null;
                let productsError = null;
                try {
                    products = await api.request('/products/');
                } catch (err) {
                    productsError = err.message;
                }

                output.innerHTML = `
                    <h2 class="success">✓ User Profile</h2>
                    <pre>${JSON.stringify(profile, null, 2)}</pre>
                    
                    <h2>Seller Analytics ${analyticsError ? '❌' : '✓'}</h2>
                    ${analyticsError 
                        ? `<p class="error">Error: ${analyticsError}</p>`
                        : `<pre>${JSON.stringify(analytics, null, 2)}</pre>`
                    }
                    
                    <h2>Products API ${productsError ? '❌' : '✓'}</h2>
                    ${productsError 
                        ? `<p class="error">Error: ${productsError}</p>`
                        : `<pre>${JSON.stringify(products, null, 2)}</pre>`
                    }
                    
                    <h2>Token Info</h2>
                    <pre>Access Token: ${api.accessToken ? 'Present (' + api.accessToken.substring(0, 20) + '...)' : 'Missing'}\nRefresh Token: ${api.refreshToken ? 'Present' : 'Missing'}</pre>
                `;
                
            } catch (err) {
                console.error('Debug error:', err);
                output.innerHTML = `<p class="error">Error: ${err.message || err}</p><pre>${err.stack || 'No stack trace'}</pre>`;
            }
        }

        // Run on load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', debugUser);
        } else {
            debugUser();
        }
    </script>
</body>
</html>
