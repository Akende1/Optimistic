<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Optimistic | Product Detail</title>
	<link rel="stylesheet" href="./style/storefront-2026.css">
</head>
<body>
	<div class="sf-shell">
		<header class="sf-topbar">
			<a class="sf-brand" href="./index.html">OPTI<span>MISTIC</span></a>
			<div class="sf-search" style="pointer-events:none; opacity:.95;">
				<input type="text" value="Product details" readonly>
			</div>
			<a class="sf-btn ghost" href="./products.html">Back to catalog</a>
		</header>

		<section id="detail-state" class="sf-loading" style="margin-top:18px;">Loading product...</section>

		<section id="detail-view" class="sf-detail" hidden>
			<div id="detail-media" class="sf-detail-media"></div>
			<article class="sf-card sf-detail-card">
				<span class="sf-kicker" id="detail-category">Category</span>
				<h1 id="detail-title">Product</h1>
				<p class="sf-price" id="detail-price">ZMW 0.00</p>
				<div class="sf-detail-meta" id="detail-meta"></div>
				<hr class="sf-divider">
				<p class="sf-muted" id="detail-description"></p>
				<div class="sf-actions-col" style="margin-top:16px;">
					<input class="sf-number" id="detail-qty" type="number" value="1" min="1" step="1">
					<button id="add-to-cart" class="sf-btn primary" type="button">Add to cart</button>
					<a class="sf-btn" href="./shoppingcart.html">Open cart</a>
				</div>
				<div id="detail-message" style="margin-top:12px;"></div>
			</article>
		</section>
	</div>

	<script>
		const params = new URLSearchParams(window.location.search);
		const productId = params.get('id');

		function money(value) {
			const n = Number(value || 0);
			try {
				return new Intl.NumberFormat('en-ZM', { style: 'currency', currency: 'ZMW' }).format(n);
			} catch (_) {
				return `ZMW ${n.toFixed(2)}`;
			}
		}

		function getCart() {
			const raw = localStorage.getItem('optimisticCart') || localStorage.getItem('legacyCart') || '[]';
			try {
				const list = JSON.parse(raw);
				return Array.isArray(list) ? list : [];
			} catch (_) {
				return [];
			}
		}

		function saveCart(items) {
			localStorage.setItem('optimisticCart', JSON.stringify(items));
			localStorage.setItem('legacyCart', JSON.stringify(items));
		}

		function setMessage(text, type = 'ok') {
			const el = document.getElementById('detail-message');
			if (!text) {
				el.innerHTML = '';
				return;
			}
			if (type === 'error') {
				el.innerHTML = `<div class="sf-error">${text}</div>`;
				return;
			}
			el.innerHTML = `<div class="sf-kicker">${text}</div>`;
		}

		async function fetchJson(path) {
			const response = await fetch(path);
			const payload = await response.json().catch(() => ({}));
			if (!response.ok) throw new Error(payload.detail || `Request failed (${response.status})`);
			return payload;
		}

		function renderProduct(product) {
			const image = product?.images?.find((i) => i?.image_url)?.image_url || product?.images?.[0]?.image_url || '';
			const stock = Number(product.stock || 0);

			document.getElementById('detail-title').textContent = product.name || 'Untitled product';
			document.getElementById('detail-price').textContent = money(product.price);
			document.getElementById('detail-category').textContent = product.category_name || 'Uncategorized';
			document.getElementById('detail-description').textContent = product.description || 'No description available for this product.';
			document.getElementById('detail-meta').innerHTML = `
				<div class="sf-list-item"><span>Seller</span><strong>${product.seller_name || 'Optimistic Seller'}</strong></div>
				<div class="sf-list-item"><span>Stock</span><strong>${stock > 0 ? `${stock} available` : 'Out of stock'}</strong></div>
				<div class="sf-list-item"><span>Status</span><strong>${product.status || 'ACTIVE'}</strong></div>
			`;

			document.getElementById('detail-media').innerHTML = image
				? `<img src="${image}" alt="${(product.name || 'Product').replace(/"/g, '&quot;')}">`
				: '<div class="sf-media-empty">No image uploaded by seller</div>';

			const addBtn = document.getElementById('add-to-cart');
			addBtn.disabled = stock <= 0;
			addBtn.textContent = stock > 0 ? 'Add to cart' : 'Out of stock';
			addBtn.onclick = () => {
				const qtyInput = document.getElementById('detail-qty');
				const qty = Math.max(1, Number(qtyInput.value || 1));
				if (qty > stock) {
					setMessage(`Only ${stock} item(s) currently available.`, 'error');
					return;
				}

				const cart = getCart();
				const index = cart.findIndex((item) => Number(item.id) === Number(product.id));
				const imageList = (product.images || []).map((i) => i.image_url).filter(Boolean);

				if (index >= 0) {
					cart[index].qty = Number(cart[index].qty || 0) + qty;
				} else {
					cart.push({
						id: product.id,
						productTitle: product.name,
						price: Number(product.price || 0),
						qty,
						productImg: imageList
					});
				}

				saveCart(cart);
				setMessage('Added to cart successfully.');
			};

			document.getElementById('detail-state').hidden = true;
			document.getElementById('detail-view').hidden = false;
		}

		async function init() {
			if (!productId) {
				document.getElementById('detail-state').className = 'sf-error';
				document.getElementById('detail-state').textContent = 'Missing product id. Open this page from the product catalog.';
				return;
			}

			try {
				const product = await fetchJson(`/api/products/${encodeURIComponent(productId)}/`);
				renderProduct(product);
			} catch (error) {
				document.getElementById('detail-state').className = 'sf-error';
				document.getElementById('detail-state').textContent = error.message || 'Unable to load this product.';
			}
		}

		init();
	</script>
</body>
</html>
