<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details — Optimistic</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/mobile.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="nav-logo">Optimistic</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">🛒 Cart <span id="cart-count" class="badge badge-danger">0</span></a></li>
                <li><a href="#" id="auth-link">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- Product Detail Section -->
    <section class="section">
        <div class="container">
            <div id="product-detail">
                <div class="spinner"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Optimistic · Proudly Built for Zambia 🇿🇲</p>
        </div>
    </footer>

    <script src="/static/js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        async function loadProduct() {
            if (!productId) {
                window.location.href = 'products.html';
                return;
            }

            try {
                const product = await api.getProduct(productId);
                const container = document.getElementById('product-detail');
                
                container.innerHTML = `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; margin-bottom: 3rem;">
                        <div>
                            <div style="width: 100%; height: 500px; background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-size: 8rem; box-shadow: var(--shadow-lg);">
                                📦
                            </div>
                        </div>
                        <div>
                            <div class="badge badge-${product.status === 'ACTIVE' ? 'success' : 'warning'}" style="margin-bottom: 1rem;">
                                ${product.status}
                            </div>
                            <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">${product.name}</h1>
                            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
                                <div class="product-price" style="font-size: 3rem; margin: 0;">K${product.price}</div>
                                <div class="badge ${product.stock > 0 ? 'badge-success' : 'badge-danger'}">
                                    ${product.stock > 0 ? `${product.stock} in stock` : 'Out of stock'}
                                </div>
                            </div>
                            <div style="padding: 1.5rem; background: var(--bg-light); border-radius: 0.875rem; margin-bottom: 1.5rem;">
                                <div style="font-weight: 600; color: var(--text-medium); margin-bottom: 0.5rem;">Sold by</div>
                                <div style="font-size: 1.25rem; font-weight: 700; color: var(--text-dark);">👤 ${product.seller_name}</div>
                            </div>
                            <div style="padding: 1.5rem; background: var(--bg-light); border-radius: 0.875rem; margin-bottom: 2rem;">
                                <div style="font-weight: 600; color: var(--text-medium); margin-bottom: 0.5rem;">Category</div>
                                <div style="font-size: 1.125rem; font-weight: 600; color: var(--primary-color);">${product.category_name || 'Uncategorized'}</div>
                            </div>
                            <div style="margin-bottom: 2rem;">
                                <h3 style="margin-bottom: 1rem;">Description</h3>
                                <p style="line-height: 1.8; color: var(--text-medium);">${product.description || 'No description available.'}</p>
                            </div>
                            <div style="display: flex; gap: 1rem;">
                                <button class="btn btn-primary" onclick="addToCart(${product.id})" style="flex: 1;" ${product.stock <= 0 ? 'disabled' : ''}>
                                    🛒 Add to Cart
                                </button>
                                <button class="btn btn-secondary" onclick="buyNow(${product.id})" ${product.stock <= 0 ? 'disabled' : ''}>
                                    ⚡ Buy Now
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading product:', error);
                document.getElementById('product-detail').innerHTML = `
                    <div class="alert alert-error">
                        Failed to load product details. <a href="products.html">Back to Products</a>
                    </div>
                `;
            }
        }

        function addToCart(productId) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const existing = cart.find(item => item.id === productId);
            
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id: productId, quantity: 1 });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            alert('Added to cart! 🛒');
        }

        function buyNow(productId) {
            addToCart(productId);
            window.location.href = 'cart.html';
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').textContent = count;
        }

        function updateAuthLink() {
            const authLink = document.getElementById('auth-link');
            if (api.isAuthenticated()) {
                authLink.textContent = 'Profile';
                authLink.href = 'profile.html';
            } else {
                authLink.textContent = 'Login';
                authLink.href = 'login.html';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProduct();
            updateCartCount();
            updateAuthLink();
        });
    </script>
</body>
</html>
