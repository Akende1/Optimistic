<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist — Optimistic</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/mobile.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="nav-logo">Optimistic</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="buyer-dashboard.html">Dashboard</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </div>
    </nav>

    <!-- Wishlist Section -->
    <section class="section">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
                <div>
                    <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">❤️ My Wishlist</h1>
                    <p style="color: var(--text-light); margin: 0;"><span id="wishlist-count">0</span> items saved</p>
                </div>
                <div>
                    <button class="btn btn-secondary" onclick="clearWishlist()">Clear All</button>
                </div>
            </div>

            <div id="wishlist-container">
                <div class="spinner"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>About Optimistic</h4>
                    <ul>
                        <li><a href="about.html">About Us</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>Customer Service</h4>
                    <ul>
                        <li><a href="orders.html">Track Order</a></li>
                        <li><a href="contact.html">Help Center</a></li>
                    </ul>
                </div>
            </div>
            <p>© 2026 Optimistic. All rights reserved.</p>
        </div>
    </footer>

    <script src="/static/js/api.js"></script>
    <script>
        let wishlist = [];

        function loadWishlist() {
            wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
            document.getElementById('wishlist-count').textContent = wishlist.length;
            
            const container = document.getElementById('wishlist-container');
            
            if (wishlist.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="text-align: center; padding: 4rem 2rem;">
                        <div style="font-size: 5rem; margin-bottom: 1rem;">💔</div>
                        <h2 style="margin-bottom: 1rem;">Your wishlist is empty</h2>
                        <p style="color: var(--text-light); margin-bottom: 2rem;">Start adding products you love!</p>
                        <a href="products.html" class="btn btn-primary">Browse Products</a>
                    </div>
                `;
                return;
            }

            // Display wishlist items in a grid
            container.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem;">
                    ${wishlist.map((item, index) => `
                        <div class="card" style="position: relative;">
                            <button onclick="removeFromWishlist(${index})" 
                                    style="position: absolute; top: 1rem; right: 1rem; background: var(--danger-color); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 1.25rem; display: flex; align-items: center; justify-content: center; z-index: 10;">
                                ×
                            </button>
                            <div style="width: 100%; height: 200px; background: var(--bg-light); border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; font-size: 4rem; margin-bottom: 1rem;">
                                📦
                            </div>
                            <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;">${item.name}</h3>
                            <div style="color: var(--text-light); font-size: 0.875rem; margin-bottom: 1rem;">
                                ${item.seller_name || 'Optimistic'}
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div style="font-size: 1.5rem; font-weight: 800; color: var(--primary-color);">
                                    K${parseFloat(item.price).toFixed(2)}
                                </div>
                                <button onclick="addToCart(${item.id})" class="btn btn-primary" style="padding: 0.5rem 1rem;">
                                    Add to Cart
                                </button>
                            </div>
                            <button onclick="viewProduct(${item.id})" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;">
                                View Details
                            </button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function removeFromWishlist(index) {
            if (confirm('Remove this item from your wishlist?')) {
                wishlist.splice(index, 1);
                localStorage.setItem('wishlist', JSON.stringify(wishlist));
                loadWishlist();
            }
        }

        function clearWishlist() {
            if (confirm('Are you sure you want to clear your entire wishlist?')) {
                localStorage.removeItem('wishlist');
                loadWishlist();
            }
        }

        async function addToCart(productId) {
            try {
                const product = await api.getProduct(productId);
                
                let cart = JSON.parse(localStorage.getItem('cart') || '[]');
                const existingItem = cart.find(item => item.id === product.id);
                
                if (existingItem) {
                    existingItem.quantity++;
                } else {
                    cart.push({
                        id: product.id,
                        name: product.name,
                        price: product.price,
                        seller: product.seller,
                        quantity: 1
                    });
                }
                
                localStorage.setItem('cart', JSON.stringify(cart));
                alert(`${product.name} added to cart!`);
            } catch (error) {
                alert('Failed to add item to cart');
            }
        }

        function viewProduct(productId) {
            window.location.href = `product-detail.html?id=${productId}`;
        }

        document.addEventListener('DOMContentLoaded', loadWishlist);
    </script>
</body>
</html>
