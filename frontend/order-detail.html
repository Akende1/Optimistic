<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details — Optimistic</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/mobile.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .order-detail-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .order-header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .order-status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .status-PENDING { background: #FEF3C7; color: #92400E; }
        .status-PAID { background: #DBEAFE; color: #1E40AF; }
        .status-READY_FOR_DELIVERY { background: #E0E7FF; color: #3730A3; }
        .status-IN_TRANSIT { background: #DDD6FE; color: #5B21B6; }
        .status-DELIVERED { background: #D1FAE5; color: #065F46; }
        .status-CANCELLED { background: #FEE2E2; color: #991B1B; }
        
        .order-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .info-item {
            padding: 15px;
            background: #F9FAFB;
            border-radius: 8px;
        }
        .info-label {
            font-size: 12px;
            color: #6B7280;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .info-value {
            font-weight: 600;
            color: #111827;
        }
        .order-items {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .order-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn-confirm-delivery {
            background: #10B981;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-cancel-order {
            background: #EF4444;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-back {
            background: #6B7280;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="nav-logo">Optimistic</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">🛒 Cart</a></li>
                <li><a href="orders.html">My Orders</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </div>
    </nav>

    <!-- Order Detail Section -->
    <section class="section">
        <div class="order-detail-container">
            <a href="orders.html" class="btn-back">← Back to Orders</a>
            
            <div id="order-content">
                <div class="spinner"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Optimistic. Built for Zambia 🇿🇲</p>
        </div>
    </footer>

    <script src="/static/js/api.js"></script>
    <script>
        const api = new ZuStoreAPI();
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        async function loadOrderDetails() {
            if (!api.isAuthenticated()) {
                window.location.href = 'login.html';
                return;
            }

            if (!orderId) {
                alert('Order ID is required');
                window.location.href = 'orders.html';
                return;
            }

            try {
                const order = await api.getOrderDetail(orderId);
                displayOrder(order);
            } catch (error) {
                console.error('Failed to load order:', error);
                document.getElementById('order-content').innerHTML = `
                    <div class="order-header">
                        <h2>Error Loading Order</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function displayOrder(order) {
            const statusClass = `status-${order.status}`;
            const statusLabel = order.status.replace(/_/g, ' ');
            
            let actionsHTML = '';
            
            // Show confirm delivery button if order is IN_TRANSIT
            if (order.status === 'IN_TRANSIT' && !order.confirmed_by_buyer) {
                actionsHTML += `<button class="btn-confirm-delivery" onclick="confirmDelivery()">✅ Confirm Delivery</button>`;
            }
            
            // Show cancel button if order is PENDING or PAID
            if (order.status === 'PENDING' || order.status === 'PAID') {
                actionsHTML += `<button class="btn-cancel-order" onclick="cancelOrder()">❌ Cancel Order</button>`;
            }

            document.getElementById('order-content').innerHTML = `
                <div class="order-header">
                    <h1>Order #${order.id}</h1>
                    <span class="order-status ${statusClass}">${statusLabel}</span>
                    
                    <div class="order-info">
                        <div class="info-item">
                            <div class="info-label">Total Amount</div>
                            <div class="info-value">ZMW ${order.total_amount}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Created</div>
                            <div class="info-value">${new Date(order.created_at).toLocaleDateString()}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Shipping Address</div>
                            <div class="info-value">${order.shipping_address}</div>
                        </div>
                        ${order.delivery_zone ? `
                        <div class="info-item">
                            <div class="info-label">Delivery Zone</div>
                            <div class="info-value">${order.delivery_zone}</div>
                        </div>
                        ` : ''}
                        ${order.delivered_at ? `
                        <div class="info-item">
                            <div class="info-label">Delivered</div>
                            <div class="info-value">${new Date(order.delivered_at).toLocaleDateString()}</div>
                        </div>
                        ` : ''}
                    </div>

                    ${actionsHTML ? `<div class="order-actions">${actionsHTML}</div>` : ''}
                </div>

                <div class="order-items">
                    <h2>Order Items</h2>
                    <p><em>Order items will be displayed here when OrderItem model is implemented.</em></p>
                </div>
            `;
        }

        async function confirmDelivery() {
            if (!confirm('Confirm that you have received this order?')) {
                return;
            }

            try {
                const result = await api.confirmDelivery(orderId);
                alert(result.message || 'Delivery confirmed!');
                loadOrderDetails(); // Reload to show updated status
            } catch (error) {
                alert('Failed to confirm delivery: ' + error.message);
            }
        }

        async function cancelOrder() {
            const reason = prompt('Why are you cancelling this order?');
            if (!reason) {
                return;
            }

            try {
                const result = await api.cancelOrder(orderId, reason);
                alert(result.message || 'Order cancelled');
                loadOrderDetails(); // Reload to show updated status
            } catch (error) {
                alert('Failed to cancel order: ' + error.message);
            }
        }

        // Load order on page load
        loadOrderDetails();
    </script>
</body>
</html>
