<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Optimistic Seller Orders</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#08101a;color:#eef3ff}.shell{max-width:1200px;margin:0 auto;padding:24px;display:grid;gap:16px}.card{background:rgba(14,22,36,.92);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.pill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}.chart{width:100%;min-height:220px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);padding:10px}.muted{color:#9aa9bf}</style></head><body><div class="shell"><div class="card row"><div><h1>Seller Orders</h1><p class="muted">Realtime order pipeline and status mix.</p></div><a class="pill" href="/seller-dashboard-v2.html">Back to dashboard</a></div><div class="card"><div class="row" style="margin-bottom:10px;"><h2>Order trend (14 days)</h2><span id="count" class="pill">0 orders</span></div><svg id="trend" class="chart" viewBox="0 0 640 220" preserveAspectRatio="none"></svg></div><div class="card"><h2 style="margin-bottom:10px;">Recent seller orders</h2><table class="table"><thead><tr><th>Order</th><th>Status</th><th>Total</th><th>Created</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="muted">Loading...</td></tr></tbody></table></div></div><script>function token(){for(const k of ['access','optimisticAccessToken','Authorization']){const r=localStorage.getItem(k);if(!r)continue;try{const p=JSON.parse(r);return typeof p==='string'?p:r;}catch(_){return r;}}return ''}function headers(){const t=token();return t?{Authorization:`Bearer ${t}`}:{}}function fmtDate(v){const d=new Date(v);return Number.isNaN(d.getTime())?v:new Intl.DateTimeFormat('en-ZM',{dateStyle:'medium'}).format(d)}function draw(list){const svg=document.getElementById('trend');const now=new Date();const map=new Map();for(let i=13;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);map.set(d.toISOString().slice(0,10),0)}list.forEach(o=>{const k=String(o.created_at||'').slice(0,10);if(map.has(k))map.set(k,map.get(k)+1)});const vals=[...map.values()],labs=[...map.keys()].map(v=>v.slice(5)),mx=Math.max(1,...vals);const pts=vals.map((v,i)=>`${(i/(vals.length-1||1))*620+10},${200-((v/mx)*170)+10}`).join(' ');svg.innerHTML=`<line x1='10' y1='200' x2='630' y2='200' stroke='rgba(255,255,255,.15)'/><polyline points='${pts}' fill='none' stroke='#56d6be' stroke-width='3'/>${vals.map((v,i)=>`<circle cx='${(i/(vals.length-1||1))*620+10}' cy='${200-((v/mx)*170)+10}' r='3' fill='#56d6be'/>`).join('')}${labs.map((l,i)=>`<text x='${(i/(labs.length-1||1))*620+10}' y='214' fill='#9aa9bf' font-size='10' text-anchor='middle'>${l}</text>`).join('')}`}
(async()=>{try{const r=await fetch('/api/sellers/orders/',{headers:headers()});const p=await r.json();if(!r.ok)throw new Error(p.error||'Failed');const list=Array.isArray(p)?p:(p.results||[]);document.getElementById('count').textContent=`${list.length} orders`;draw(list);document.getElementById('rows').innerHTML=list.length?list.slice(0,20).map(i=>`<tr><td>#${i.id}</td><td>${i.status_display||i.status}</td><td>${i.total_amount}</td><td>${fmtDate(i.created_at)}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">No orders yet.</td></tr>';}catch(e){document.getElementById('rows').innerHTML=`<tr><td colspan='4' class='muted'>${e.message}</td></tr>`;}})();</script></body></html>
