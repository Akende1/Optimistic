<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Product Moderation — Optimistic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; background: #0a0a0a; color: #e0e0e0; }
        nav { background: #111; border-bottom: 1px solid #333; padding: 1rem 0; }
        nav .nav-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 2rem; }
        nav .brand { font-weight: 700; font-size: 1.2rem; color: #ff3b30; letter-spacing: 1px; }
        nav .nav-links { display: flex; gap: 2rem; list-style: none; }
        nav .nav-links a { text-decoration: none; color: #888; font-weight: 500; font-size: 0.9rem; transition: color 0.2s; }
        nav .nav-links a:hover { color: #ff3b30; }
        nav .nav-links a.active { color: #ff3b30; border-bottom: 2px solid #ff3b30; padding-bottom: 0.25rem; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .header { margin-bottom: 2rem; }
        .header h1 { font-size: 1.75rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
        .header p { color: #666; font-size: 0.95rem; }
        
        .table-container { background: #151515; border: 1px solid #222; border-radius: 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #1a1a1a; }
        th { text-align: left; padding: 1rem; font-size: 0.85rem; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 1rem; border-top: 1px solid #222; font-size: 0.9rem; }
        tr:hover { background: #1a1a1a; }
        
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
        .badge.active { background: #1a3a1a; color: #34c759; }
        .badge.draft { background: #2a2a2a; color: #888; }
        .badge.pending { background: #3a3a1a; color: #ff9500; }
        .badge.flagged { background: #3a1a1a; color: #ff3b30; }
        
        .actions { display: flex; gap: 0.5rem; }
        .btn { padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-view { background: #1a1a1a; color: #888; }
        .btn-view:hover { background: #222; color: #fff; }
        .btn-flag { background: #3a1a1a; color: #ff3b30; }
        .btn-flag:hover { background: #ff3b30; color: #fff; }
        .btn-approve { background: #1a3a1a; color: #34c759; }
        .btn-approve:hover { background: #34c759; color: #fff; }
        
        .loading { text-align: center; padding: 4rem; color: #666; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-content">
            <div class="brand">⚡ SYSTEM CONTROL</div>
            <ul class="nav-links">
                <li><a href="admin-dashboard-v2.html">Dashboard</a></li>
                <li><a href="admin-users-v2.html">Users</a></li>
                <li><a href="admin-products-v2.html" class="active">Products</a></li>
                <li><a href="admin-orders-v2.html">Orders</a></li>
                <li><a href="admin-disputes-v2.html">Disputes</a></li>
                <li><a href="admin-finances-v2.html">Finances</a></li>
                <li><a href="admin-reports-v2.html">Reports</a></li>
                <li><a href="#" onclick="api.logout()" style="color: #ff3b30;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Product Moderation</h1>
            <p>Enforce platform rules — no price edits allowed</p>
        </div>

        <div id="loading" class="loading">Loading products...</div>

        <div id="products-table" style="display: none;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Product ID</th>
                            <th>Name</th>
                            <th>Seller</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js?v=20260129"></script>
    <script>
        async function loadProducts() {
            try {
                if (!api.isAuthenticated()) {
                    location.href = 'login.html';
                    return;
                }

                const profile = await api.getProfile();
                console.log('User profile:', profile);
                if (profile.role !== 'ADMIN') {
                    alert('Access denied');
                    location.href = 'index.html';
                    return;
                }

                console.log('Fetching products...');
                const data = await api.getProducts();
                console.log('Products data:', data);
                renderProducts(data.results || []);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('products-table').style.display = 'block';

            } catch (err) {
                console.error('Error:', err);
                document.getElementById('loading').textContent = 'Failed to load products';
            }
        }

        function renderProducts(products) {
            const tbody = document.getElementById('products-tbody');
            tbody.innerHTML = '';

            products.forEach(p => {
                const statusBadge = p.status === 'ACTIVE' ? 'active' : p.status === 'PENDING_APPROVAL' ? 'pending' : 'draft';
                tbody.innerHTML += `
                    <tr>
                        <td>#${p.id}</td>
                        <td>${p.name}</td>
                        <td>${p.seller_name || 'Unknown'}</td>
                        <td>${p.category_name || 'Uncategorized'}</td>
                        <td>K${p.price}</td>
                        <td><span class="badge ${statusBadge}">${p.status}</span></td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-view" onclick="viewProduct(${p.id})">View</button>
                                ${p.status === 'PENDING_APPROVAL' ? `<button class="btn btn-approve" onclick="approveProduct(${p.id})">Approve</button>` : ''}
                                <button class="btn btn-flag" onclick="flagProduct(${p.id})">Flag</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function viewProduct(id) {
            window.open(`product-detail.html?id=${id}`, '_blank');
        }

        async function approveProduct(id) {
            if (confirm('Approve this product for listing?')) {
                try {
                    await api.request(`/products/${id}/approve/`, { method: 'POST' });
                    alert('Product approved');
                    loadProducts();
                } catch (err) {
                    alert('Failed: ' + err.message);
                }
            }
        }

        function flagProduct(id) {
            const reason = prompt('Flag reason (policy violation):');
            if (reason) {
                alert('Product flagged - backend action needed');
            }
        }

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
