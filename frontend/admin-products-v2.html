<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Optimistic Admin Products</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#070f16;color:#eef3ff}.shell{max-width:1200px;margin:0 auto;padding:24px;display:grid;gap:16px}.card{background:rgba(13,20,31,.92);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.pill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}.muted{color:#99a8bd}</style></head><body><div class='shell'><div class='card row'><div><h1>Admin Product Moderation</h1><p class='muted'>Realtime pending approvals and actions.</p></div><a class='pill' href='/admin-dashboard-v2.html'>Back to dashboard</a></div><div class='card'><h2 style='margin:0 0 10px;'>Pending approvals</h2><table class='table'><thead><tr><th>Product</th><th>Seller</th><th>Category</th><th>Price</th><th>Action</th></tr></thead><tbody id='rows'><tr><td colspan='5' class='muted'>Loading...</td></tr></tbody></table></div></div><script>function token(){for(const k of ['access','optimisticAccessToken','Authorization']){const r=localStorage.getItem(k);if(!r)continue;try{const p=JSON.parse(r);return typeof p==='string'?p:r;}catch(_){return r;}}return ''}function headers(){const t=token();return t?{Authorization:`Bearer ${t}`}:{}}async function approve(id){const r=await fetch(`/api/admin/products/${id}/approve/`,{method:'POST',headers:headers()});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||'Approve failed')}async function suspend(id){const r=await fetch(`/api/admin/products/${id}/suspend/`,{method:'POST',headers:{'Content-Type':'application/json',...headers()},body:JSON.stringify({reason:'Policy moderation'})});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||'Suspend failed')}async function load(){const tbody=document.getElementById('rows');try{const r=await fetch('/api/admin/moderation/pending-approvals/',{headers:headers()});const p=await r.json();if(!r.ok)throw new Error(p.error||'Failed pending approvals');const list=p.products||[];tbody.innerHTML=list.length?list.map(i=>`<tr><td>${i.name}</td><td>${i.seller?.store_name||''}</td><td>${i.category||''}</td><td>${i.price}</td><td><button onclick='runAction(${i.id},"approve")'>Approve</button> <button onclick='runAction(${i.id},"suspend")'>Suspend</button></td></tr>`).join(''):"<tr><td colspan='5' class='muted'>No pending products.</td></tr>"}catch(e){tbody.innerHTML=`<tr><td colspan='5' class='muted'>${e.message}</td></tr>`}}async function runAction(id,type){try{if(type==='approve')await approve(id);else await suspend(id);await load();}catch(e){alert(e.message)}}load();</script></body></html>
