<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Optimistic Seller Profile</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#08101a;color:#eef3ff}.shell{max-width:1000px;margin:0 auto;padding:24px;display:grid;gap:16px}.card{background:rgba(14,22,36,.92);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px}.pill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}.muted{color:#9aa9bf}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><div class="shell"><div class="card row"><div><h1>Seller Profile & Verification</h1><p class='muted'>Realtime account trust and profile details.</p></div><a class='pill' href='/seller-dashboard-v2.html'>Back to dashboard</a></div><div class="card"><div class='grid' id='profile'><div class='field muted'>Loading...</div></div></div></div><script>function token(){for(const k of ['access','optimisticAccessToken','Authorization']){const r=localStorage.getItem(k);if(!r)continue;try{const p=JSON.parse(r);return typeof p==='string'?p:r;}catch(_){return r;}}return ''}function headers(){const t=token();return t?{Authorization:`Bearer ${t}`}:{}}(async()=>{try{const [p,v]=await Promise.all([fetch('/api/auth/profile/',{headers:headers()}),fetch('/api/sellers/verification/status/',{headers:headers()})]);const profile=await p.json();const verification=await v.json();if(!p.ok)throw new Error(profile.error||'Failed profile');if(!v.ok)throw new Error(verification.error||'Failed verification status');const seller=verification.seller||{};const kyc=verification.verification||{};document.getElementById('profile').innerHTML=`<div class='field'><strong>User</strong><div>${profile.full_name||profile.username||'-'}</div></div><div class='field'><strong>Role</strong><div>${profile.role||'-'}</div></div><div class='field'><strong>Phone verified</strong><div>${profile.phone_verified?'Yes':'No'}</div></div><div class='field'><strong>Email verified</strong><div>${profile.email_verified?'Yes':'No'}</div></div><div class='field'><strong>Store verified</strong><div>${seller.verified?'Yes':'No'}</div></div><div class='field'><strong>KYC status</strong><div>${kyc.status||seller.verification_status||'PENDING'}</div></div>`;}catch(e){document.getElementById('profile').innerHTML=`<div class='field muted'>${e.message}</div>`;}})();</script></body></html>
