<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Optimistic | Store</title>
  <link rel="stylesheet" href="./style/storefront-2026.css">
  <style>
    .shell{max-width:1100px;margin:20px auto;padding:16px}
    .header{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .store-hero{background:linear-gradient(135deg,rgba(139,149,255,0.06),rgba(88,166,255,0.04));padding:18px;border-radius:12px;margin-top:12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:16px}
    .card{background:rgba(14,20,35,0.92);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px}
    .muted{color:#9ea9c5}
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <a href="./index.html" class="brand">OPTIMISTIC</a>
      <nav>
        <a href="./products.html" class="pill">Browse</a>
        <a href="./signin.html" class="pill">Sign in</a>
      </nav>
    </div>

    <div id="store-root">
      <div class="store-hero card">
        <h1 id="store-name">Store</h1>
        <div id="store-meta" class="muted">Loading store information...</div>
      </div>

      <section>
        <h2 style="margin-top:18px">Products</h2>
        <div id="products-grid" class="grid">Loading products...</div>
      </section>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sellerId = params.get('seller_id');

    function money(v){try{return new Intl.NumberFormat('en-ZM',{style:'currency',currency:'ZMW'}).format(Number(v||0))}catch(_){return `ZMW ${Number(v||0).toFixed(2)}`}}

    async function fetchJson(path){
      const r = await fetch(path);
      const p = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(p.detail||`Request failed (${r.status})`);
      return p;
    }

    async function loadStore() {
      if(!sellerId){document.getElementById('store-root').innerHTML='<div class="muted">No seller specified.</div>';return}
      try{
        const [seller, products] = await Promise.all([
          fetchJson(`/api/sellers/${encodeURIComponent(sellerId)}/`),
          fetchJson(`/api/sellers/${encodeURIComponent(sellerId)}/products/?status=ACTIVE`)
        ]);

        document.getElementById('store-name').textContent = seller.store_name || seller.name || 'Store';
        document.getElementById('store-meta').textContent = seller.description || '';

        const list = Array.isArray(products) ? products : (products.results || []);
        const grid = document.getElementById('products-grid');
        if(!list.length) {grid.innerHTML = '<div class="muted">No products yet.</div>';return}

        grid.innerHTML = list.map(p=>`<div class="card"><div style="height:120px;background:#0b1221;display:flex;align-items:center;justify-content:center">${p.images && p.images.length?`<img src="${p.images[0].image_url}" style="max-width:100%;max-height:100%">`:'No image'}</div><h3>${p.name}</h3><div class="muted">${money(p.price)}</div><div style="margin-top:8px"><a class="pill" href="./product-detail.html?id=${encodeURIComponent(p.id)}">View</a></div></div>`).join('');

      }catch(e){document.getElementById('store-root').innerHTML=`<div class="muted">${e.message}</div>`}
    }

    loadStore();
  </script>
</body>
</html>
