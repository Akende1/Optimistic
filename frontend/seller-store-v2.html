<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Optimistic Seller Storefront</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#08101a;color:#eef3ff}.shell{max-width:1000px;margin:0 auto;padding:24px;display:grid;gap:16px}.card{background:rgba(14,22,36,.92);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.pill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}.muted{color:#9aa9bf}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><div class="shell"><div class="card row"><div><h1>Seller Storefront</h1><p class="muted">Realtime store identity and publish readiness.</p></div><a class="pill" href="/seller-dashboard-v2.html">Back to dashboard</a></div><div class="card"><div class="grid" id="store"><div class="field muted">Loading store profile...</div></div></div></div><script>function token(){for(const k of ['access','optimisticAccessToken','Authorization']){const r=localStorage.getItem(k);if(!r)continue;try{const p=JSON.parse(r);return typeof p==='string'?p:r;}catch(_){return r;}}return ''}function headers(){const t=token();return t?{Authorization:`Bearer ${t}`}:{}}(async()=>{try{const [me,d]=await Promise.all([fetch('/api/sellers/me/',{headers:headers()}),fetch('/api/sellers/dashboard/',{headers:headers()})]);const seller=await me.json();const dash=await d.json();if(!me.ok)throw new Error(seller.error||'Failed store profile');if(!d.ok)throw new Error(dash.error||'Failed dashboard profile');document.getElementById('store').innerHTML=`<div class='field'><strong>Store name</strong><div>${seller.store_name||'-'}</div></div><div class='field'><strong>Verification status</strong><div>${dash.verification_status||'-'}</div></div><div class='field'><strong>Description</strong><div>${seller.description||'No description yet.'}</div></div><div class='field'><strong>Completion</strong><div>${dash.completion_percentage||0}%</div></div><div class='field'><strong>Location</strong><div>${seller.primary_location_full||seller.town_city||'-'}</div></div><div class='field'><strong>Contact phone</strong><div>${seller.phone||'-'}</div></div>`;}catch(e){document.getElementById('store').innerHTML=`<div class='field muted'>${e.message}</div>`;}})();</script></body></html>
