<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verify Account</title>
  <style>body{font-family:sans-serif;padding:24px;background:#f6f8fb} .card{max-width:560px;margin:20px auto;padding:20px;background:#fff;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.06)} label{display:block;margin-top:12px} input,select{width:100%;padding:10px;margin-top:6px;border:1px solid #dde6f0;border-radius:6px} button{margin-top:14px;padding:10px 14px;border:none;background:#3b82f6;color:#fff;border-radius:6px;cursor:pointer}</style>
</head>
<body>
  <div class="card">
    <h2>Verify your account</h2>
    <p>Select channel and request a verification code, then confirm it.</p>
    <label>Channel
      <select id="channel">
        <option value="PHONE">Phone</option>
        <option value="EMAIL">Email</option>
      </select>
    </label>
    <div id="phone-info" style="display:block">
      <label>Phone (as in your profile)
        <input id="phone" placeholder="+2607..." />
      </label>
    </div>
    <button id="request">Request Code</button>
    <div id="request-response" style="margin-top:12px;color:#065f46"></div>

    <label style="margin-top:18px">Enter code
      <input id="code" placeholder="123456" />
    </label>
    <button id="confirm">Confirm Code</button>
    <div id="confirm-response" style="margin-top:12px;color:#b91c1c"></div>
  </div>

  <script>
    function getStoredToken(){
      const keys=['access','optimisticAccessToken','Authorization'];
      for(const k of keys){const v=localStorage.getItem(k); if(!v) continue; try{return JSON.parse(v)}catch{ return v }}
      return ''
    }
    function authHeaders(){const t=getStoredToken(); return t?{Authorization:`Bearer ${t}`}:{} }

    document.getElementById('channel').addEventListener('change', (e)=>{
      const v=e.target.value; document.getElementById('phone-info').style.display = v==='PHONE' ? 'block' : 'none';
    });

    document.getElementById('request').addEventListener('click', async ()=>{
      const channel = document.getElementById('channel').value;
      const phone = document.getElementById('phone').value;
      const payload = { channel };
      if(channel==='PHONE') payload.phone = phone;
      try{
        const resp = await fetch('/api/auth/verification/request/', { method:'POST', headers: Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify(payload) });
        const js = await resp.json();
        if(!resp.ok) throw new Error(js.error || js.detail || 'Request failed');
        document.getElementById('request-response').textContent = js.message + (js.debug_code?(' (debug code: '+js.debug_code+')'):'');
      }catch(err){ document.getElementById('request-response').textContent = err.message }
    });

    document.getElementById('confirm').addEventListener('click', async ()=>{
      const channel = document.getElementById('channel').value;
      const code = document.getElementById('code').value.trim();
      try{
        const resp = await fetch('/api/auth/verification/confirm/', { method:'POST', headers: Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({ channel, code }) });
        const js = await resp.json();
        if(!resp.ok) throw new Error(js.error || js.detail || 'Confirm failed');
        document.getElementById('confirm-response').style.color = '#034d28';
        document.getElementById('confirm-response').textContent = js.message || 'Verified';
      }catch(err){ document.getElementById('confirm-response').textContent = err.message }
    });
  </script>
</body>
</html>
