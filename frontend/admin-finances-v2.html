<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Optimistic Admin Finances</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#070f16;color:#eef3ff}.shell{max-width:1100px;margin:0 auto;padding:24px;display:grid;gap:16px}.card{background:rgba(13,20,31,.92);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.pill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}.muted{color:#99a8bd}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}.metric strong{display:block;font-size:1.6rem;margin-top:6px}.chart{width:100%;min-height:220px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);padding:10px}@media(max-width:900px){.metrics{grid-template-columns:1fr}}</style></head><body><div class='shell'><div class='card row'><div><h1>Admin Finances</h1><p class='muted'>Realtime GMV and platform revenue trends.</p></div><a class='pill' href='/admin-dashboard-v2.html'>Back to dashboard</a></div><div class='card metrics' id='metrics'><div class='metric'><span class='muted'>GMV</span><strong>--</strong></div><div class='metric'><span class='muted'>Platform revenue</span><strong>--</strong></div><div class='metric'><span class='muted'>Seller earnings</span><strong>--</strong></div><div class='metric'><span class='muted'>Orders</span><strong>--</strong></div></div><div class='card'><h2 style='margin:0 0 10px;'>GMV trend</h2><svg id='trend' class='chart' viewBox='0 0 640 220' preserveAspectRatio='none'></svg></div></div><script>function token(){for(const k of ['access','optimisticAccessToken','Authorization']){const r=localStorage.getItem(k);if(!r)continue;try{const p=JSON.parse(r);return typeof p==='string'?p:r;}catch(_){return r;}}return ''}function headers(){const t=token();return t?{Authorization:`Bearer ${t}`}:{}}function money(v){const n=Number(v||0);try{return new Intl.NumberFormat('en-ZM',{style:'currency',currency:'ZMW'}).format(n)}catch(_){return`ZMW ${n.toFixed(2)}`}}function draw(rows){const svg=document.getElementById('trend');const vals=(rows||[]).map(r=>Number(r.total_gmv||0));const labs=(rows||[]).map(r=>String(r.date||'').slice(5));if(!vals.length){svg.innerHTML='';return;}const mx=Math.max(1,...vals);const pts=vals.map((v,i)=>`${(i/(vals.length-1||1))*620+10},${200-((v/mx)*170)+10}`).join(' ');svg.innerHTML=`<line x1='10' y1='200' x2='630' y2='200' stroke='rgba(255,255,255,.15)'/><polyline points='${pts}' fill='none' stroke='#f4c95d' stroke-width='3'/>${vals.map((v,i)=>`<circle cx='${(i/(vals.length-1||1))*620+10}' cy='${200-((v/mx)*170)+10}' r='3' fill='#f4c95d'/>`).join('')}${labs.map((l,i)=>`<text x='${(i/(labs.length-1||1))*620+10}' y='214' fill='#99a8bd' font-size='10' text-anchor='middle'>${l}</text>`).join('')}`}
(async()=>{try{const [g,r]=await Promise.all([fetch('/api/admin/reports/gmv/',{headers:headers()}),fetch('/api/admin/reports/revenue/',{headers:headers()})]);const gmv=await g.json();const rev=await r.json();if(!g.ok)throw new Error(gmv.error||'Failed GMV report');if(!r.ok)throw new Error(rev.error||'Failed revenue report');document.getElementById('metrics').innerHTML=`<div class='metric'><span class='muted'>GMV</span><strong>${money(gmv.summary?.total_gmv||0)}</strong></div><div class='metric'><span class='muted'>Platform revenue</span><strong>${money(rev.revenue?.platform_commission||0)}</strong></div><div class='metric'><span class='muted'>Seller earnings</span><strong>${money(rev.revenue?.seller_earnings||0)}</strong></div><div class='metric'><span class='muted'>Orders</span><strong>${gmv.summary?.total_orders||0}</strong></div>`;draw(gmv.daily_breakdown||[]);}catch(e){document.getElementById('metrics').innerHTML=`<div class='metric'><span class='muted'>Error</span><strong>${e.message}</strong></div>`;}})();</script></body></html>
