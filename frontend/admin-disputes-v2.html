<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Optimistic Admin Disputes</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#070f16;color:#eef3ff}.shell{max-width:1000px;margin:0 auto;padding:24px;display:grid;gap:16px}.card{background:rgba(13,20,31,.92);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px}.pill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.muted{color:#99a8bd}</style></head><body><div class='shell'><div class='card row'><div><h1>Admin Disputes</h1><p class='muted'>Realtime dispute operations and escalation monitor.</p></div><a class='pill' href='/admin-dashboard-v2.html'>Back to dashboard</a></div><div class='card'><p id='msg' class='muted'>Loading disputes...</p></div></div><script>function token(){for(const k of ['access','optimisticAccessToken','Authorization']){const r=localStorage.getItem(k);if(!r)continue;try{const p=JSON.parse(r);return typeof p==='string'?p:r;}catch(_){return r;}}return ''}function headers(){const t=token();return t?{Authorization:`Bearer ${t}`}:{}}(async()=>{const node=document.getElementById('msg');try{const r=await fetch('/api/admin/disputes/',{headers:headers()});if(r.status===404){node.textContent='Dispute admin endpoint is not currently routed. This page is ready and will show realtime items once /api/admin/disputes/ is available.';return;}const p=await r.json();if(!r.ok)throw new Error(p.error||'Failed disputes');const list=p.results||p;node.textContent=list.length?`${list.length} disputes currently in system.`:'No disputes currently.';}catch(e){node.textContent=e.message;}})();</script></body></html>
