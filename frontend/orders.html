<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders — Optimistic</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/mobile.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="nav-logo">Optimistic</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">🛒 Cart</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </div>
    </nav>

    <!-- Orders Section -->
    <section class="section">
        <div class="container">
            <h1 class="section-title">📦 My Orders</h1>
            
            <!-- Filter Tabs -->
            <div class="order-filters" style="display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center;">
                <button class="filter-btn active" data-status="all">All Orders</button>
                <button class="filter-btn" data-status="PENDING">Pending</button>
                <button class="filter-btn" data-status="PAID">Paid</button>
                <button class="filter-btn" data-status="IN_TRANSIT">In Transit</button>
                <button class="filter-btn" data-status="DELIVERED">Delivered</button>
                <button class="filter-btn" data-status="CANCELLED">Cancelled</button>
            </div>
            
            <div id="orders-list">
                <div class="spinner"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Optimistic · Proudly Built for Zambia 🇿🇲</p>
        </div>
    </footer>

    <script src="/static/js/api.js"></script>
    <script>
        let allOrders = [];
        
        async function loadOrders() {
            if (!api.isAuthenticated()) {
                window.location.href = 'login.html?redirect=orders.html';
                return;
            }

            try {
                const data = await api.getOrders();
                allOrders = data.results || data || [];
                displayOrders(allOrders);
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('orders-list').innerHTML = `
                    <div class="alert alert-error">Failed to load orders. Please try again.</div>
                `;
            }
        }
        
        function displayOrders(orders) {
            const container = document.getElementById('orders-list');
            
            if (!orders || orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No orders found</h3>
                        <p>Start shopping to place your first order</p>
                        <a href="products.html" class="btn btn-primary" style="margin-top: 1rem;">Browse Products</a>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = orders.map(order => `
                <div class="card" style="margin-bottom: 2rem;">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1.5rem;">
                        <div>
                            <h3>Order #${order.id}</h3>
                            <p style="color: var(--text-light); margin: 0;">Placed on ${new Date(order.created_at).toLocaleDateString()}</p>
                            ${order.delivery_zone ? `<p style="color: var(--text-light); margin: 4px 0;">📍 ${order.delivery_zone}</p>` : ''}
                            ${order.delivery_partner_name ? `<p style="color: var(--text-light); margin: 4px 0;">🚚 ${order.delivery_partner_name}</p>` : ''}
                        </div>
                        <div class="badge badge-${getStatusColor(order.status)}">
                            ${order.status_display || order.status.replace('_', ' ')}
                        </div>
                    </div>
                    <div style="border-top: 1px solid var(--border-color); padding-top: 1rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                            <div>
                                <div style="font-size: 1.5rem; font-weight: 800; color: var(--primary-color);">K${parseFloat(order.total_amount).toFixed(2)}</div>
                                ${order.confirmed_by_buyer ? '<p style="color: #10b981; margin: 4px 0; font-size: 0.875rem;">✓ Delivery Confirmed</p>' : ''}
                            </div>
                            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                                <a href="order-detail.html?id=${order.id}" class="btn btn-primary">View Details</a>
                                ${order.can_confirm_delivery ? `
                                <button class="btn" style="background: #10b981; color: white;" onclick="confirmDelivery(${order.id})">
                                    ✓ Confirm Delivery
                                </button>
                                ` : ''}
                                ${(order.status === 'PENDING' || order.status === 'PAID') ? `
                                <button class="btn btn-secondary" onclick="cancelOrder(${order.id})">Cancel Order</button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // Filter functionality
        document.addEventListener('DOMContentLoaded', () => {
            loadOrders();
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    const status = this.dataset.status;
                    if (status === 'all') {
                        displayOrders(allOrders);
                    } else {
                        const filtered = allOrders.filter(order => order.status === status);
                        displayOrders(filtered);
                    }
                });
            });
        });

        function getStatusColor(status) {
            const colors = {
                'PENDING': 'warning',
                'PAID': 'success',
                'READY_FOR_DELIVERY': 'success',
                'IN_TRANSIT': 'info',
                'DELIVERED': 'success',
                'CANCELLED': 'danger'
            };
            return colors[status] || 'warning';
        }
        
        async function confirmDelivery(orderId) {
            if (!confirm('Confirm that you have received your order?')) return;

            try {
                await api.confirmDelivery(orderId);
                alert('✓ Delivery confirmed! Thank you for your order.');
                loadOrders(); // Reload orders
            } catch (error) {
                console.error('Error confirming delivery:', error);
                alert('Failed to confirm delivery: ' + error.message);
            }
        }

        async function cancelOrder(orderId) {
            const reason = prompt('Please tell us why you\'re cancelling this order:');
            if (!reason) return;
            
            try {
                await api.cancelOrder(orderId, reason);
                alert('Order cancelled successfully');
                loadOrders();
            } catch (error) {
                console.error('Error cancelling order:', error);
                alert('Failed to cancel order: ' + error.message);
            }
        }
    </script>
    
    <style>
        .filter-btn {
            padding: 8px 20px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        
        .badge-info {
            background: #fce7f3;
            color: #9f1239;
        }
    </style>
</body>
</html>
