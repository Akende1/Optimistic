<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Optimistic | Products</title>
	<link rel="stylesheet" href="./style/storefront-2026.css">
</head>
<body>
	<div class="sf-shell">
		<header class="sf-topbar">
			<a class="sf-brand" href="./index.html">OPTI<span>MISTIC</span></a>
			<form class="sf-search" id="search-form">
				<select id="category-filter"><option value="">All categories</option></select>
				<input id="search-input" type="search" placeholder="Search products, stores, categories...">
				<button class="sf-btn primary" type="submit">Search</button>
			</form>
			<a class="sf-btn ghost" href="./shoppingcart.html" id="cart-btn">Cart</a>
		</header>

		<section class="sf-section">
			<div class="sf-section-header">
				<div>
					<h2>Marketplace products</h2>
					<p>Realtime catalog from Optimistic sellers</p>
				</div>
				<div class="sf-chip-row" id="quick-categories"></div>
			</div>
			<div id="catalog-state" class="sf-loading">Loading products...</div>
			<div id="catalog-grid" class="sf-grid" hidden></div>
		</section>

		<footer class="sf-footer">
			<span>Optimistic 2026 UI system</span>
			<span id="results-count">0 results</span>
		</footer>
	</div>

	<script>
		const initialParams = new URLSearchParams(window.location.search);

		const state = {
			products: [],
			categories: [],
			currentCategory: initialParams.get('category_slug') || '',
			currentQuery: initialParams.get('q') || ''
		};

		function money(value) {
			const n = Number(value || 0);
			try {
				return new Intl.NumberFormat('en-ZM', { style: 'currency', currency: 'ZMW' }).format(n);
			} catch (_) {
				return `ZMW ${n.toFixed(2)}`;
			}
		}

		function getImage(product) {
			const image = product?.images?.find((item) => item?.image_url)?.image_url || product?.images?.[0]?.image_url || '';
			return image;
		}

		function setState(message, type = 'loading') {
			const node = document.getElementById('catalog-state');
			node.className = type === 'error' ? 'sf-error' : (type === 'empty' ? 'sf-empty' : 'sf-loading');
			node.textContent = message;
			node.hidden = false;
			document.getElementById('catalog-grid').hidden = true;
		}

		function renderProducts(products) {
			const grid = document.getElementById('catalog-grid');
			if (!products.length) {
				setState('No products found for this filter.', 'empty');
				document.getElementById('results-count').textContent = '0 results';
				return;
			}

			grid.innerHTML = products.map((product) => {
				const image = getImage(product);
				const stock = Number(product.stock || 0);
				const sellerName = product.seller?.store_name || product.seller?.name || product.store_name || '';
				const sellerId = product.seller?.id || product.seller_id || product.store_owner_id || '';
				return `
					<article class="sf-product" data-id="${product.id}">
						<div class="sf-product-media">
							${image ? `<img src="${image}" alt="${(product.name || 'Product').replace(/"/g, '&quot;')}">` : '<div class="sf-media-empty">No image uploaded</div>'}
						</div>
						<div class="sf-product-body">
							<div class="sf-product-title">${product.name || 'Untitled product'}</div>
							<div class="sf-product-meta">
								<span class="sf-price">${money(product.price)}</span>
								<span class="sf-muted">${stock > 0 ? `${stock} in stock` : 'Out of stock'}</span>
							</div>
							${sellerName ? `<div class="sf-muted">Sold by <a href="./store.html?seller_id=${encodeURIComponent(sellerId)}">${sellerName}</a></div>` : ''}
							<button class="sf-btn" type="button" data-open="${product.id}">View details</button>
						</div>
					</article>
				`;
			}).join('');

			grid.hidden = false;
			document.getElementById('catalog-state').hidden = true;
			document.getElementById('results-count').textContent = `${products.length} result${products.length === 1 ? '' : 's'}`;

			grid.querySelectorAll('[data-open]').forEach((button) => {
				button.addEventListener('click', () => {
					const id = button.getAttribute('data-open');
					window.location.href = `./product-detail.html?id=${encodeURIComponent(id)}`;
				});
			});
		}

		function renderCategories() {
			const filter = document.getElementById('category-filter');
			const quick = document.getElementById('quick-categories');

			const cats = Array.isArray(state.categories) ? state.categories : (state.categories && state.categories.results) ? state.categories.results : [];
			filter.innerHTML = '<option value="">All categories</option>' + cats.map((c) => `<option value="${c.slug}">${c.name}</option>`).join('');
			filter.value = state.currentCategory;

			quick.innerHTML = cats.slice(0, 8).map((c) => `
				<button type="button" class="sf-chip ${state.currentCategory === c.slug ? 'active' : ''}" data-category="${c.slug}">${c.name}</button>
			`).join('');

			quick.querySelectorAll('[data-category]').forEach((button) => {
				button.addEventListener('click', () => {
					state.currentCategory = button.getAttribute('data-category') || '';
					loadProducts();
				});
			});
		}

		async function fetchJson(path) {
			const response = await fetch(path);
			const payload = await response.json().catch(() => ({}));
			if (!response.ok) throw new Error(payload.detail || `Request failed (${response.status})`);
			return payload;
		}

		async function loadCategories() {
			try {
				state.categories = await fetchJson('/api/categories/');
			} catch (_) {
				state.categories = [];
			}
			renderCategories();
		}

		async function loadProducts() {
			setState('Loading products...');
			const query = new URLSearchParams();
			if (state.currentCategory) query.set('category_slug', state.currentCategory);
			if (state.currentQuery) query.set('q', state.currentQuery);
			query.set('status', 'ACTIVE');

			try {
				const payload = await fetchJson(`/api/products/?${query.toString()}`);
				state.products = Array.isArray(payload) ? payload : (payload.results || []);
				renderCategories();
				renderProducts(state.products);
			} catch (error) {
				setState(error.message || 'Unable to load products right now.', 'error');
			}
		}

		document.getElementById('search-input').value = state.currentQuery;

		document.getElementById('search-form').addEventListener('submit', (event) => {
			event.preventDefault();
			state.currentQuery = document.getElementById('search-input').value.trim();
			state.currentCategory = document.getElementById('category-filter').value;
			loadProducts();
		});

		document.getElementById('category-filter').addEventListener('change', (event) => {
			state.currentCategory = event.target.value;
			loadProducts();
		});

		const cartRaw = localStorage.getItem('optimisticCart') || localStorage.getItem('legacyCart') || '[]';
		try {
			const cartItems = JSON.parse(cartRaw);
			if (Array.isArray(cartItems) && cartItems.length > 0) {
				document.getElementById('cart-btn').textContent = `Cart (${cartItems.length})`;
			}
		} catch (_) {
			// no-op
		}

		loadCategories();
		loadProducts();
	</script>
</body>
</html>
