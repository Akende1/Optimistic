<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Test — Zu-Store</title>
    <style>
        body { font-family: monospace; padding: 2rem; background: #1a1a1a; color: #0f0; }
        .test { margin: 1rem 0; padding: 1rem; background: #000; border: 1px solid #333; }
        .pass { border-left: 4px solid #0f0; }
        .fail { border-left: 4px solid #f00; color: #f00; }
        .warn { border-left: 4px solid #ff0; color: #ff0; }
        button { background: #0f0; color: #000; padding: 0.5rem 1rem; border: none; cursor: pointer; margin: 0.5rem; }
        pre { background: #000; padding: 0.5rem; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 Zu-Store System Diagnostic</h1>
    
    <div id="tests"></div>
    
    <h2>Manual Tests</h2>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="testCategories()">Test Categories</button>
    <button onclick="testProducts()">Test Products</button>
    <button onclick="testSellerAnalytics()">Test Seller Analytics</button>
    
    <script src="/static/js/api.js"></script>
    <script>
        const api = new ZuStoreAPI();
        const testsDiv = document.getElementById('tests');
        
        function addTest(name, status, message) {
            const div = document.createElement('div');
            div.className = `test ${status}`;
            div.innerHTML = `
                <strong>${status === 'pass' ? '✓' : status === 'fail' ? '✗' : '⚠'} ${name}</strong>
                <div>${message}</div>
            `;
            testsDiv.appendChild(div);
        }
        
        // Run automatic tests
        async function runTests() {
            // Test 1: Check if API client is loaded
            if (typeof ZuStoreAPI !== 'undefined') {
                addTest('API Client', 'pass', 'ZuStoreAPI class is loaded');
            } else {
                addTest('API Client', 'fail', 'ZuStoreAPI class not found');
                return;
            }
            
            // Test 2: Check authentication status
            const isAuth = api.isAuthenticated();
            if (isAuth) {
                const profile = await api.getProfile();
                addTest('Authentication', 'pass', `Logged in as: ${profile.username} (${profile.role})`);
            } else {
                addTest('Authentication', 'warn', 'Not logged in - some tests will fail');
            }
            
            // Test 3: Test unauthenticated endpoint
            try {
                const categories = await api.getCategories();
                addTest('Public API (Categories)', 'pass', `Found ${categories.results?.length || 0} categories`);
            } catch (error) {
                addTest('Public API (Categories)', 'fail', error.message);
            }
            
            // Test 4: Test authenticated endpoint (if logged in)
            if (isAuth) {
                try {
                    const analytics = await api.getSellerAnalytics();
                    addTest('Seller Analytics', 'pass', `Total products: ${analytics.total_products}, Revenue: K${analytics.revenue.total}`);
                } catch (error) {
                    addTest('Seller Analytics', 'fail', error.message);
                }
            }
            
            // Test 5: Check localStorage
            const accessToken = localStorage.getItem('access_token');
            const refreshToken = localStorage.getItem('refresh_token');
            if (accessToken && refreshToken) {
                addTest('Token Storage', 'pass', 'Access and refresh tokens found in localStorage');
            } else if (accessToken) {
                addTest('Token Storage', 'warn', 'Only access token found (refresh missing)');
            } else {
                addTest('Token Storage', 'warn', 'No tokens in localStorage (not logged in)');
            }
        }
        
        async function testLogin() {
            const username = prompt('Username:', 'testseller');
            const password = prompt('Password:', 'test123');
            try {
                const result = await api.login(username, password);
                addTest('Manual Login Test', 'pass', `Logged in successfully! Role: ${result.user.role}`);
                location.reload();
            } catch (error) {
                addTest('Manual Login Test', 'fail', error.message);
            }
        }
        
        async function testCategories() {
            try {
                const data = await api.getCategories();
                addTest('Manual Categories Test', 'pass', JSON.stringify(data, null, 2));
            } catch (error) {
                addTest('Manual Categories Test', 'fail', error.message);
            }
        }
        
        async function testProducts() {
            try {
                const data = await api.getProducts({ seller: 'me' });
                addTest('Manual Products Test', 'pass', JSON.stringify(data, null, 2));
            } catch (error) {
                addTest('Manual Products Test', 'fail', error.message);
            }
        }
        
        async function testSellerAnalytics() {
            try {
                const data = await api.getSellerAnalytics();
                addTest('Manual Analytics Test', 'pass', `<pre>${JSON.stringify(data, null, 2)}</pre>`);
            } catch (error) {
                addTest('Manual Analytics Test', 'fail', error.message);
            }
        }
        
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
