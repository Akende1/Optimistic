<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Optimistic Seller Disputes</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#08101a;color:#eef3ff}.shell{max-width:1000px;margin:0 auto;padding:24px;display:grid;gap:16px}.card{background:rgba(14,22,36,.92);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px}.pill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.muted{color:#9aa9bf}</style></head><body><div class='shell'><div class='card row'><div><h1>Seller Disputes</h1><p class='muted'>Realtime dispute visibility for seller operations.</p></div><a class='pill' href='/seller-dashboard-v2.html'>Back to dashboard</a></div><div class='card'><p id='msg' class='muted'>Loading dispute data...</p></div></div><script>function token(){for(const k of ['access','optimisticAccessToken','Authorization']){const r=localStorage.getItem(k);if(!r)continue;try{const p=JSON.parse(r);return typeof p==='string'?p:r;}catch(_){return r;}}return ''}function headers(){const t=token();return t?{Authorization:`Bearer ${t}`}:{}}(async()=>{const node=document.getElementById('msg');try{const r=await fetch('/api/disputes/',{headers:headers()});if(r.status===404){node.textContent='Dispute endpoint is not exposed yet in this workspace. Seller dispute queue will appear here once /api/disputes/ is routed.';return;}const p=await r.json();if(!r.ok)throw new Error(p.error||'Failed to load disputes');const list=Array.isArray(p)?p:(p.results||[]);node.textContent=list.length?`You currently have ${list.length} dispute record(s).`:'No disputes currently linked to your account.';}catch(e){node.textContent=e.message;}})();</script></body></html>
