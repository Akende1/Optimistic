<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Orders Oversight — Optimistic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; background: #0a0a0a; color: #e0e0e0; }
        nav { background: #111; border-bottom: 1px solid #333; padding: 1rem 0; }
        nav .nav-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 2rem; }
        nav .brand { font-weight: 700; font-size: 1.2rem; color: #ff3b30; letter-spacing: 1px; }
        nav .nav-links { display: flex; gap: 2rem; list-style: none; }
        nav .nav-links a { text-decoration: none; color: #888; font-weight: 500; font-size: 0.9rem; transition: color 0.2s; }
        nav .nav-links a:hover { color: #ff3b30; }
        nav .nav-links a.active { color: #ff3b30; border-bottom: 2px solid #ff3b30; padding-bottom: 0.25rem; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .header { margin-bottom: 2rem; }
        .header h1 { font-size: 1.75rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
        .header p { color: #666; font-size: 0.95rem; }
        
        .table-container { background: #151515; border: 1px solid #222; border-radius: 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #1a1a1a; }
        th { text-align: left; padding: 1rem; font-size: 0.85rem; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 1rem; border-top: 1px solid #222; font-size: 0.9rem; }
        tr:hover { background: #1a1a1a; }
        
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
        .badge.paid { background: #3a3a1a; color: #ff9500; }
        .badge.ready { background: #1a2a3a; color: #0a84ff; }
        .badge.in-transit { background: #1a3a3a; color: #5ac8fa; }
        .badge.delivered { background: #1a3a1a; color: #34c759; }
        .badge.cancelled { background: #3a1a1a; color: #ff3b30; }
        
        .actions { display: flex; gap: 0.5rem; }
        .btn { padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-view { background: #1a1a1a; color: #888; }
        .btn-view:hover { background: #222; color: #fff; }
        .btn-lock { background: #3a1a1a; color: #ff3b30; }
        .btn-lock:hover { background: #ff3b30; color: #fff; }
        
        .loading { text-align: center; padding: 4rem; color: #666; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-content">
            <div class="brand">⚡ SYSTEM CONTROL</div>
            <ul class="nav-links">
                <li><a href="admin-dashboard-v2.html">Dashboard</a></li>
                <li><a href="admin-users-v2.html">Users</a></li>
                <li><a href="admin-products-v2.html">Products</a></li>
                <li><a href="admin-orders-v2.html" class="active">Orders</a></li>
                <li><a href="admin-disputes-v2.html">Disputes</a></li>
                <li><a href="admin-finances-v2.html">Finances</a></li>
                <li><a href="admin-reports-v2.html">Reports</a></li>
                <li><a href="#" onclick="api.logout()" style="color: #ff3b30;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Orders Oversight</h1>
            <p>Full visibility — observational, not transactional</p>
        </div>

        <div id="loading" class="loading">Loading orders...</div>

        <div id="orders-table" style="display: none;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Buyer</th>
                            <th>Sellers</th>
                            <th>Total</th>
                            <th>Commission</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js?v=20260129"></script>
    <script>
        async function loadOrders() {
            try {
                if (!api.isAuthenticated()) {
                    location.href = 'login.html';
                    return;
                }

                const profile = await api.getProfile();
                console.log('User profile:', profile);
                if (profile.role !== 'ADMIN') {
                    alert('Access denied');
                    location.href = 'index.html';
                    return;
                }

                // Fetch all orders (admin can see all orders)
                console.log('Fetching orders...');
                const data = await api.getAllOrders();
                console.log('Orders data:', data);
                renderOrders(data.results || []);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('orders-table').style.display = 'block';
                
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('loading').textContent = 'Failed to load orders: ' + err.message;
            }
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('orders-tbody');
            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem;">No orders found</td></tr>';
                return;
            }

            orders.forEach(order => {
                const statusClass = {
                    'PENDING': 'pending',
                    'PAID': 'active',
                    'IN_TRANSIT': 'pending',
                    'DELIVERED': 'active',
                    'CANCELLED': 'suspended'
                }[order.status] || 'draft';

                tbody.innerHTML += `
                    <tr>
                        <td>#${order.id}</td>
                        <td>${order.buyer_name || 'Unknown'}</td>
                        <td>${order.seller_name || 'Unknown'}</td>
                        <td>K${parseFloat(order.total_amount).toFixed(2)}</td>
                        <td><span class="badge ${statusClass}">${order.status}</span></td>
                        <td>${new Date(order.created_at).toLocaleDateString()}</td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-view" onclick="viewOrder(${order.id})">View</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function viewOrder(id) {
            window.open(`order-detail.html?id=${id}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
