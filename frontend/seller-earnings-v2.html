<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Optimistic Seller Earnings</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#08101a;color:#eef3ff}.shell{max-width:1100px;margin:0 auto;padding:24px;display:grid;gap:16px}.card{background:rgba(14,22,36,.92);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}.muted{color:#9aa9bf}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}.metric strong{display:block;font-size:1.8rem;margin-top:8px}.chart{width:100%;min-height:220px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);padding:10px}@media(max-width:900px){.metrics{grid-template-columns:1fr}}</style></head><body><div class="shell"><div class="card row"><div><h1>Seller Earnings</h1><p class="muted">Realtime revenue performance and payout readiness.</p></div><a class="pill" href="/seller-dashboard-v2.html">Back to dashboard</a></div><div class="card metrics" id="metrics"><div class="metric"><span class="muted">Total revenue</span><strong>--</strong></div><div class="metric"><span class="muted">Items sold</span><strong>--</strong></div><div class="metric"><span class="muted">Total orders</span><strong>--</strong></div><div class="metric"><span class="muted">Delivered</span><strong>--</strong></div></div><div class="card"><h2 style="margin:0 0 10px;">Revenue trend (last 14 days)</h2><svg id="trend" class="chart" viewBox="0 0 640 220" preserveAspectRatio="none"></svg></div></div><script>function token(){for(const k of ['access','optimisticAccessToken','Authorization']){const r=localStorage.getItem(k);if(!r)continue;try{const p=JSON.parse(r);return typeof p==='string'?p:r;}catch(_){return r;}}return ''}function headers(){const t=token();return t?{Authorization:`Bearer ${t}`}:{}}function money(v){const n=Number(v||0);try{return new Intl.NumberFormat('en-ZM',{style:'currency',currency:'ZMW'}).format(n)}catch(_){return`ZMW ${n.toFixed(2)}`}}function draw(orders){const svg=document.getElementById('trend');const now=new Date();const map=new Map();for(let i=13;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);map.set(d.toISOString().slice(0,10),0)}orders.forEach(o=>{const k=String(o.created_at||'').slice(0,10);if(map.has(k))map.set(k,map.get(k)+Number(o.total_amount||0))});const vals=[...map.values()],labs=[...map.keys()].map(v=>v.slice(5)),mx=Math.max(1,...vals);const pts=vals.map((v,i)=>`${(i/(vals.length-1||1))*620+10},${200-((v/mx)*170)+10}`).join(' ');svg.innerHTML=`<line x1='10' y1='200' x2='630' y2='200' stroke='rgba(255,255,255,.15)'/><polyline points='${pts}' fill='none' stroke='#f4c95d' stroke-width='3'/>${vals.map((v,i)=>`<circle cx='${(i/(vals.length-1||1))*620+10}' cy='${200-((v/mx)*170)+10}' r='3' fill='#f4c95d'/>`).join('')}${labs.map((l,i)=>`<text x='${(i/(labs.length-1||1))*620+10}' y='214' fill='#9aa9bf' font-size='10' text-anchor='middle'>${l}</text>`).join('')}`}
(async()=>{try{const [a,o]=await Promise.all([fetch('/api/sellers/analytics/',{headers:headers()}),fetch('/api/sellers/orders/',{headers:headers()})]);const analytics=await a.json();const ordersRaw=await o.json();if(!a.ok)throw new Error(analytics.error||'Failed analytics');if(!o.ok)throw new Error(ordersRaw.error||'Failed orders');const orders=Array.isArray(ordersRaw)?ordersRaw:(ordersRaw.results||[]);document.getElementById('metrics').innerHTML=`<div class='metric'><span class='muted'>Total revenue</span><strong>${money(analytics.revenue?.total||0)}</strong></div><div class='metric'><span class='muted'>Items sold</span><strong>${analytics.revenue?.items_sold||0}</strong></div><div class='metric'><span class='muted'>Total orders</span><strong>${analytics.orders?.total||0}</strong></div><div class='metric'><span class='muted'>Delivered</span><strong>${analytics.orders?.delivered||0}</strong></div>`;draw(orders);}catch(e){document.getElementById('metrics').innerHTML=`<div class='metric'><span class='muted'>Error</span><strong>${e.message}</strong></div>`;}})();</script></body></html>
