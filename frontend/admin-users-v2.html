<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>User Management — Optimistic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; background: #0a0a0a; color: #e0e0e0; }
        nav { background: #111; border-bottom: 1px solid #333; padding: 1rem 0; }
        nav .nav-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 2rem; }
        nav .brand { font-weight: 700; font-size: 1.2rem; color: #ff3b30; letter-spacing: 1px; }
        nav .nav-links { display: flex; gap: 2rem; list-style: none; }
        nav .nav-links a { text-decoration: none; color: #888; font-weight: 500; font-size: 0.9rem; transition: color 0.2s; }
        nav .nav-links a:hover { color: #ff3b30; }
        nav .nav-links a.active { color: #ff3b30; border-bottom: 2px solid #ff3b30; padding-bottom: 0.25rem; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .header { margin-bottom: 2rem; }
        .header h1 { font-size: 1.75rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
        .header p { color: #666; font-size: 0.95rem; }
        
        .filters { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .filter-btn { background: #151515; border: 1px solid #333; color: #888; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .filter-btn:hover { border-color: #ff3b30; color: #ff3b30; }
        .filter-btn.active { background: #ff3b30; border-color: #ff3b30; color: #fff; }
        
        .table-container { background: #151515; border: 1px solid #222; border-radius: 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #1a1a1a; }
        th { text-align: left; padding: 1rem; font-size: 0.85rem; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 1rem; border-top: 1px solid #222; font-size: 0.9rem; }
        tr:hover { background: #1a1a1a; }
        
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
        .badge.active { background: #1a3a1a; color: #34c759; }
        .badge.suspended { background: #3a1a1a; color: #ff3b30; }
        .badge.pending { background: #3a3a1a; color: #ff9500; }
        .badge.verified { background: #1a2a3a; color: #0a84ff; }
        
        .actions { display: flex; gap: 0.5rem; }
        .btn { padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-view { background: #1a1a1a; color: #888; }
        .btn-view:hover { background: #222; color: #fff; }
        .btn-suspend { background: #3a1a1a; color: #ff3b30; }
        .btn-suspend:hover { background: #ff3b30; color: #fff; }
        .btn-verify { background: #1a3a1a; color: #34c759; }
        .btn-verify:hover { background: #34c759; color: #fff; }
        
        .loading { text-align: center; padding: 4rem; color: #666; }
        .empty { text-align: center; padding: 4rem; color: #666; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-content">
            <div class="brand">⚡ SYSTEM CONTROL</div>
            <ul class="nav-links">
                <li><a href="admin-dashboard-v2.html">Dashboard</a></li>
                <li><a href="admin-users-v2.html" class="active">Users</a></li>
                <li><a href="admin-products-v2.html">Products</a></li>
                <li><a href="admin-orders-v2.html">Orders</a></li>
                <li><a href="admin-disputes-v2.html">Disputes</a></li>
                <li><a href="admin-finances-v2.html">Finances</a></li>
                <li><a href="admin-reports-v2.html">Reports</a></li>
                <li><a href="#" onclick="api.logout()" style="color: #ff3b30;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>User Management</h1>
            <p>View and control all platform identities</p>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterUsers('all')">All Users</button>
            <button class="filter-btn" onclick="filterUsers('BUYER')">Buyers</button>
            <button class="filter-btn" onclick="filterUsers('SELLER')">Sellers</button>
            <button class="filter-btn" onclick="filterUsers('COURIER')">Couriers</button>
            <button class="filter-btn" onclick="filterUsers('ADMIN')">Admins</button>
        </div>

        <div id="loading" class="loading">Loading users...</div>

        <div id="users-table" style="display: none;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Joined</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <div id="empty" class="empty" style="display: none;">No users found</div>
    </div>

    <script src="/static/js/api.js?v=20260129c"></script>
    <script>
        let allUsers = [];

        async function loadUsers() {
            const loading = document.getElementById('loading');
            const table = document.getElementById('users-table');
            const empty = document.getElementById('empty');

            try {
                if (!api.isAuthenticated()) {
                    location.href = 'login.html';
                    return;
                }

                const profile = await api.getProfile();
                console.log('User profile:', profile);
                if (profile.role !== 'ADMIN') {
                    alert('Access denied');
                    location.href = 'index.html';
                    return;
                }

                // Fetch real users from API
                console.log('Fetching users...');
                allUsers = await api.getAllUsers();
                console.log('Loaded users:', allUsers);

                renderUsers(allUsers);
                loading.style.display = 'none';
                table.style.display = 'block';

            } catch (err) {
                console.error('Error loading users:', err);
                loading.textContent = 'Failed to load users: ' + err.message;
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('users-tbody');
            tbody.innerHTML = '';

            if (users.length === 0) {
                document.getElementById('users-table').style.display = 'none';
                document.getElementById('empty').style.display = 'block';
                return;
            }

            users.forEach(user => {
                const statusBadge = user.is_active 
                    ? '<span class="badge active">Active</span>' 
                    : '<span class="badge suspended">Suspended</span>';

                const row = `
                    <tr>
                        <td>#${user.id}</td>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td><span class="badge pending">${user.role}</span></td>
                        <td>${statusBadge}</td>
                        <td>${new Date(user.date_joined).toLocaleDateString()}</td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-view" onclick="viewUser(${user.id})">View</button>
                                ${user.is_active 
                                    ? `<button class="btn btn-suspend" onclick="suspendUser(${user.id})">Suspend</button>`
                                    : `<button class="btn btn-verify" onclick="activateUser(${user.id})">Activate</button>`
                                }
                            </div>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function filterUsers(role) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const filtered = role === 'all' 
                ? allUsers 
                : allUsers.filter(u => u.role === role);

            renderUsers(filtered);
        }

        function viewUser(id) {
            window.location.href = `admin-user-detail.html?id=${id}`;
        }

        async function suspendUser(id) {
            const reason = prompt('Suspension reason (optional):');
            if (reason === null) return; // User cancelled
            
            if (!confirm('Are you sure you want to suspend this user?')) {
                return;
            }

            try {
                await api.request(`/admin/users/${id}/suspend/`, {
                    method: 'POST'
                });
                alert('User suspended successfully');
                await loadUsers();
            } catch (err) {
                console.error('Suspend error:', err);
                alert('Failed to suspend user: ' + err.message);
            }
        }

        async function activateUser(id) {
            if (!confirm('Are you sure you want to activate this user?')) {
                return;
            }

            try {
                await api.request(`/admin/users/${id}/activate/`, {
                    method: 'POST'
                });
                alert('User activated successfully');
                await loadUsers();
            } catch (err) {
                console.error('Activate error:', err);
                alert('Failed to activate user: ' + err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
